<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>แผนออมทรัพย์ · คุณกัปตัน</title>
<link rel="icon" href="icon.svg" type="image/svg+xml"><meta name="theme-color" content="#D31145">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:16px 0}
.k{background:var(--card);border:1px solid var(--b);border-radius:12px;padding:14px 16px}
.k .l{font-size:13px;color:var(--t2)}.k .v{font-size:24px;font-weight:700;margin-top:4px}.k .s{font-size:12px;color:var(--m)}
.k.g .v{color:#16a34a}.k.r .v{color:var(--aia)}
.sec{background:var(--card);border:1px solid var(--b);border-radius:12px;padding:16px 18px;margin-top:16px}
.sec h3{margin:0 0 12px;font-size:16px;color:var(--aia)}
.tl{display:flex;border-radius:10px;overflow:hidden;font-size:13px;text-align:center}
.tl div{padding:12px 6px;color:#fff}
.bar{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:14px}
.bar .a{width:80px;color:var(--t2)}.bar .t{flex:1;background:var(--aia-bg);border-radius:6px;height:22px;position:relative}
.bar .t i{display:block;height:100%;background:#16a34a;border-radius:6px}.bar .n{width:150px;text-align:right;font-weight:600}
details summary{cursor:pointer;color:var(--aia);font-weight:600}
.ft{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}.ft th{background:var(--aia-bg);color:var(--aia);padding:7px}.ft td{padding:6px;border-bottom:1px solid var(--b);text-align:right}.ft td:first-child{text-align:center}
.tb{border:1px solid var(--b);background:#fff;padding:8px 14px;border-radius:18px;font:inherit;font-size:14px;cursor:pointer}.tb.on{background:var(--aia);color:#fff;border-color:var(--aia)}
.cmpT{font-size:14px}.cmpT td.lb{text-align:left;color:var(--t2)}
.cmpT td.win{background:#dcfce7;color:#166534;font-weight:700}
.bdg{display:inline-block;background:#16a34a;color:#fff;font-size:11px;font-weight:600;padding:2px 7px;border-radius:10px;margin:3px 0 0 6px;white-space:nowrap}
.hg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.hc{border:1px solid var(--b);border-radius:10px;padding:12px}.hc .bdg{margin:6px 6px 0 0}.hs{font-size:12px;color:var(--t2);margin-top:8px}
</style></head><body><div class="wrap">
<div class="hd"><div><h1 id="t1"></h1><p id="t2"></p></div><div class="cust" style="background:rgba(255,255,255,.18);padding:8px 14px;border-radius:20px">👨 คุณกัปตัน · อายุ 25 ปี</div></div>
<div id="tabs" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:16px"></div><div id="app"></div>
<div class="note">* เป็นตัวอย่างเพื่อความเข้าใจเท่านั้น รายละเอียดความคุ้มครองจะระบุในกรมธรรม์<br>* ลดหย่อนภาษีคำนวณตามฐานภาษีในใบเสนอขาย (ใช้สิทธิ์ได้ตามจริงไม่เกิน 100,000 บาท/ปี)<br>* เงินคืนรายงวดจ่าย ณ สิ้นปีกรมธรรม์ ตามอัตรา % ของจำนวนเงินเอาประกันภัย</div>
</div>
<script>const PLANS=[{"code": "5Pay10 (Non Par)", "th": "สะสมทรัพย์ 10 ปี ชำระเบี้ย 5 ปี (ไม่มีเงินปันผล) · แถม ADB อุบัติเหตุ 30,000 ฟรี", "type": "สะสมทรัพย์", "sa": 30000, "prem": 26100, "payYears": 5, "startAge": 25, "tax": 26100, "taxRate": 20, "cover": "10 ปี ถึงอายุ 34 ปี", "death": [30000, 60000, 90000, 120000, 150000, 150000, 150000, 150000, 150000, 150000], "cash": [0, 1200, 1200, 1200, 1200, 1200, 1200, 1200, 1200, 140400]}, {"code": "AIA Endowment 15/25", "th": "เอไอเอ สะสมทรัพย์ 15/25 (ไม่มีเงินปันผล)", "type": "สะสมทรัพย์", "sa": 350000, "prem": 28350, "payYears": 15, "startAge": 25, "tax": 85050, "taxRate": 20, "cover": "25 ปี ถึงอายุ 49 ปี", "death": [350000, 350000, 350000, 350000, 350000, 350000, 350000, 350000, 350000, 350000, 350000, 385000, 402500, 437500, 472500, 472500, 472500, 472500, 472500, 472500, 472500, 472500, 472500, 472500, 472500], "cash": [0, 3500, 3500, 3500, 3500, 3500, 3500, 3500, 3500, 3500, 3500, 3500, 3500, 3500, 3500, 3500, 3500, 3500, 3500, 3500, 3500, 3500, 3500, 3500, 423500]}, {"code": "AIA Excellent (Non Par)", "th": "เอไอเอ เอ็กเซลเลนท์ (ไม่มีเงินปันผล)", "type": "สะสมทรัพย์", "sa": 170000, "prem": 25993, "payYears": 20, "startAge": 25, "tax": 103972, "taxRate": 20, "cover": "20 ปี ถึงอายุ 44 ปี", "death": [170000, 170000, 170000, 170000, 170000, 170000, 170000, 190944, 199937, 225930, 340000, 340000, 340000, 340000, 344930, 510000, 510000, 510000, 510000, 510000], "cash": [0, 0, 0, 17000, 0, 0, 0, 17000, 0, 0, 0, 17000, 0, 0, 0, 17000, 0, 0, 0, 510000]}];
const f=n=>Math.round(n).toLocaleString('en-US');
const S=p=>{const paid=p.prem*p.payYears,back=p.cash.reduce((a,b)=>a+b,0),end=p.startAge+p.payYears-1,last=p.startAge+p.cash.length-1,fc=p.startAge+p.cash.findIndex(v=>v>0);let cp=0,cr=0,be=null;for(let i=0;i<p.cash.length;i++){if(p.startAge+i<=end)cp+=p.prem;cr+=p.cash[i];if(be===null&&cr>=cp){be=p.startAge+i;break}}return{paid,back,end,last,fc,be,gain:back-paid,x:back/paid}};
function bands(p){const o=[];p.cash.forEach((v,i)=>{if(!v)return;const a=p.startAge+i,l=o[o.length-1];if(l&&l.v===v&&l.b===a-1&&i<p.cash.length-1)l.b=a;else o.push({a,b:a,v})});return o}
function render(i){document.querySelectorAll('.tb').forEach((b,j)=>b.classList.toggle('on',j===i));
 if(i===PLANS.length)return cmp();
 const p=PLANS[i],s=S(p),bd=bands(p),mx=Math.max(...bd.map(b=>(b.b-b.a+1)*b.v));
 t1.textContent='💰 '+p.code;t2.textContent=p.th+' · คุ้มครอง '+p.cover;
 const L=s.last-p.startAge+1;
 app.innerHTML=`<div class="kp">
 <div class="k"><div class="l">จ่ายเบี้ย</div><div class="v">${f(p.prem)}</div><div class="s">บาท/ปี × ${p.payYears} ปี (อายุ ${p.startAge}–${s.end})</div></div>
 <div class="k"><div class="l">รวมจ่ายทั้งหมด</div><div class="v">${f(s.paid)}</div><div class="s">บาท</div></div>
 <div class="k r"><div class="l">🎯 จุดคุ้มทุน</div><div class="v">${s.be?"อายุ "+s.be:"–"}</div><div class="s">${s.be?"เงินคืนสะสม ≥ เบี้ยที่จ่าย (ปีที่ "+(s.be-p.startAge+1)+")":"ไม่ถึงจุดคุ้มทุน"}</div></div>
 <div class="k g"><div class="l">รวมได้คืน</div><div class="v">${f(s.back)}</div><div class="s">บาท</div></div>
 <div class="k g"><div class="l">ได้มากกว่าที่จ่าย</div><div class="v">+${f(s.gain)}</div><div class="s">บาท (${s.x.toFixed(2)} เท่า)</div></div>
 ${p.tax?`<div class="k r"><div class="l">ลดหย่อนภาษีรวม</div><div class="v">${f(p.tax)}</div><div class="s">บาท (ฐานภาษี ${p.taxRate}%)</div></div>`:''}</div>
 <div class="sec"><h3>🗓️ ภาพรวมตลอดสัญญา</h3>
 <div class="tl" style="margin-bottom:6px"><div style="flex:${p.payYears};background:#7c3aed">จ่ายเบี้ย อายุ ${p.startAge}–${s.end}</div><div style="flex:${L-p.payYears};background:#e5e7eb;color:#555">ไม่ต้องจ่ายแล้ว</div></div>
 <div class="tl"><div style="flex:${s.fc-p.startAge};background:#e5e7eb"></div><div style="flex:${s.last-s.fc+1};background:#16a34a">รับเงินคืน อายุ ${s.fc}–${s.last}</div></div>
 <div style="font-size:13px;color:var(--t2);margin-top:8px">🛡️ คุ้มครองชีวิต ${p.cover}</div></div>
 <div class="sec"><h3>💵 เงินคืนที่ได้รับ</h3>${bd.map(b=>`<div class="bar"><span class="a">อายุ ${b.a}${b.a!==b.b?'–'+b.b:''}</span><span class="t"><i style="width:${(b.b-b.a+1)*b.v/mx*100}%"></i></span><span class="n">${f(b.v)}${b.a!==b.b?'/ปี':''} <small style="color:var(--m)">${b.a!==b.b?'(รวม '+f((b.b-b.a+1)*b.v)+')':''}</small></span></div>`).join('')}</div>
 <div class="sec"><h3>🛡️ ถ้าเสียชีวิต ครอบครัวได้รับ</h3><div style="font-size:14px">สูงสุด <b style="color:var(--aia)">${f(Math.max(...p.death))}</b> บาท · ต่ำสุด ${f(Math.min(...p.death))} บาท</div>
 <details style="margin-top:10px"><summary>ดูตารางรายปี</summary><table class="ft"><tr><th>อายุ</th><th>เบี้ย</th><th>เงินคืน</th><th>กรณีเสียชีวิต</th></tr>
 ${p.death.map((d,i)=>{const a=p.startAge+i;return `<tr><td>${a}</td><td>${a<=s.end?f(p.prem):'-'}</td><td style="color:#16a34a">${p.cash[i]?f(p.cash[i]):'-'}</td><td>${f(d)}</td></tr>`}).join('')}</table></details></div>`}
function cmp(){t1.textContent='⚖️ เปรียบเทียบแผน';t2.textContent='เทียบทุกแผนของคุณกัปตัน';
 const R=[['ประเภท',p=>p.type],
 ['ทุนประกัน',p=>f(p.sa),p=>p.sa,'max','💎 ทุนสูงสุด'],
 ['จ่ายเบี้ย/ปี',p=>f(p.prem)],
 ['จ่ายกี่ปี',p=>p.payYears+' ปี',p=>p.payYears,'min','⏱️ จ่ายสั้นสุด'],
 ['รวมจ่าย',p=>f(S(p).paid)],
 ['รวมได้คืน',p=>f(S(p).back),p=>S(p).back,'max','🏆 ได้คืนมากสุด'],
 ['ได้มากกว่าที่จ่าย',p=>'+'+f(S(p).gain)+' ('+S(p).x.toFixed(2)+' เท่า)',p=>S(p).x,'max','📈 คุ้มสุด'],
 ['💰 ได้เงินคืนครบที่อายุ',p=>'อายุ '+S(p).last,p=>S(p).last,'min','💰 ได้ครบไวสุด'],['🎯 จุดคุ้มทุน',p=>S(p).be?'อายุ '+S(p).be:'–',p=>S(p).be||999,'min','🎯 คุ้มทุนไวสุด'],['เริ่มรับเงินคืน',p=>'อายุ '+S(p).fc,p=>S(p).fc,'min','⚡ ได้เงินไวสุด'],
 ['คุ้มครอง',p=>p.cover,p=>S(p).last,'max','🛡️ ยาวสุด'],
 ['เสียชีวิตสูงสุด',p=>f(Math.max(...p.death)),p=>Math.max(...p.death),'max','❤️ สูงสุด'],
 ['ลดหย่อนภาษีรวม',p=>p.tax?f(p.tax):'–',p=>p.tax||0,'max','🧾 ลดหย่อนสูงสุด']];
 const cell=(r,p)=>{if(!r[2])return `<td>${r[1](p)}</td>`;const vs=PLANS.map(r[2]),b=r[3]==='max'?Math.max(...vs):Math.min(...vs),win=r[2](p)===b;
  return win?`<td class="win">${r[1](p)}<span class="bdg">${r[4]}</span></td>`:`<td>${r[1](p)}</td>`};
 const wins=PLANS.map(p=>R.filter(r=>r[2]&&(()=>{const vs=PLANS.map(r[2]);return r[2](p)===(r[3]==='max'?Math.max(...vs):Math.min(...vs))})()).map(r=>r[4]));
 app.innerHTML=`<div class="sec" style="overflow-x:auto"><table class="ft cmpT"><tr><th></th>${PLANS.map(p=>`<th>${p.code}</th>`).join('')}</tr>${R.map(r=>`<tr><td class="lb">${r[0]}</td>${PLANS.map(p=>cell(r,p)).join('')}</tr>`).join('')}</table></div>
 <div class="sec"><h3>🏅 จุดเด่นของแต่ละแผน</h3><div class="hg">${PLANS.map((p,i)=>`<div class="hc"><b>${p.code}</b><div>${wins[i].length?wins[i].map(w=>`<span class="bdg">${w}</span>`).join(''):'<span style="color:var(--m);font-size:13px">–</span>'}</div><div class="hs">จ่าย ${f(p.prem)}/ปี × ${p.payYears} ปี · ได้คืน ${f(S(p).back)}</div></div>`).join('')}</div></div>`}
tabs.innerHTML=PLANS.map((p,i)=>`<button class="tb" onclick="render(${i})">${i+1}. ${p.code}</button>`).join('')+`<button class="tb" onclick="render(${PLANS.length})">⚖️ เปรียบเทียบ</button>`;
render(0);
</script></body></html>
