<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ตั้งค่า · Insurance Plan Finder</title><link rel="icon" href="icon.svg"><link rel="stylesheet" href="css/style.css">
<style>body{font-family:'Noto Sans Thai','Inter',sans-serif;background:#f8f9fb;margin:0}.w{max-width:900px;margin:0 auto;padding:16px}.hd{background:#D31145;color:#fff;border-radius:14px;padding:18px 20px}.hd h1{margin:0;font-size:22px}.cd{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:16px;margin-top:12px}.cd h3{margin:0 0 6px;color:#D31145}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}a.cd{display:block;text-decoration:none;color:#111}a.cd:hover{border-color:#D31145}.cd p{margin:0;color:#666;font-size:14px}input{width:100%;padding:9px 12px;border:1px solid #ddd;border-radius:8px;font:inherit;margin:4px 0 10px;box-sizing:border-box}button{border:0;border-radius:8px;padding:9px 16px;font:inherit;cursor:pointer}.p{background:#D31145;color:#fff}</style></head>
<body><div class="w"><div class="hd"><h1>⚙️ ตั้งค่า</h1></div>
<div class="cd"><h3>🔗 เชื่อม Google Sheet</h3><p id="st"></p><br><label>Endpoint (Apps Script URL)<input id="e"></label><label>Token<input id="t" type="password"></label>
<button class="p" onclick="sv()">✓ บันทึก</button> <button onclick="localStorage.removeItem('ipf_sheet_cfg');ld();msg('ล้างค่าแล้ว')">ล้างค่า</button><p style="margin-top:8px;font-size:12px">เก็บเฉพาะเบราว์เซอร์นี้ ไม่ขึ้น GitHub · ต้องตั้งทีละเครื่อง</p></div>
<div class="g"><a class="cd" href="setup.html"><h3>🗂️ จัดการหน้าแผน</h3><p>แก้ยี่ห้อ / ประเภท / ชนิด / เพศ / อายุ ของแต่ละหน้า</p></a><a class="cd" href="import.html"><h3>📥 นำเข้าแผน</h3><p>สร้างหน้าแผนจากไฟล์ Excel (หลายแผนได้)</p></a></div></div>
<script src="js/config-sheet.js" onerror="0"></script><script src="js/admin-nav.js"></script>
<script>function cur(){try{return JSON.parse(localStorage.getItem('ipf_sheet_cfg'))}catch(x){}}
function ld(){const c=cur()||window.IPF_SHEET||{};e.value=c.endpoint||'';t.value=c.token||'';st.textContent=cur()?'✅ ใช้ค่าที่ตั้งในเบราว์เซอร์นี้':(window.IPF_SHEET&&window.IPF_SHEET.endpoint?'✅ ใช้ค่าจาก config-sheet.js (local)':'⚠️ ยังไม่ได้ตั้งค่า')}
function msg(x){st.textContent=x}
function sv(){localStorage.setItem('ipf_sheet_cfg',JSON.stringify({endpoint:e.value.trim(),token:t.value.trim()}));ld();msg('✅ บันทึกแล้ว')}ld()</script></body></html>
