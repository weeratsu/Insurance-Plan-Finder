<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ตั้งค่าหน้าแผน · IPF</title><link rel="icon" href="icon.svg" type="image/svg+xml"><meta name="theme-color" content="#D31145">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Inter','Noto Sans Thai',sans-serif;background:#f7f7f9;margin:0;color:#1f2937}.w{max-width:1000px;margin:0 auto;padding:16px}
.hd{background:#D31145;color:#fff;border-radius:16px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}.hd h1{margin:0;font-size:20px}.hd a{color:#fff;text-decoration:none;background:rgba(255,255,255,.18);padding:7px 14px;border-radius:20px;font-size:14px}
.c{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:16px;margin-top:14px;overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;color:#6b7280;font-size:13px;padding:8px;border-bottom:2px solid #e5e7eb}td{padding:6px 8px;border-bottom:1px solid #f1f5f9}
select,input{padding:6px 8px;border:1px solid #e5e7eb;border-radius:8px;font:inherit}.b{border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}</style></head><body><div class="w">
<div class="hd"><h1>⚙️ ตั้งค่าหน้าแผน</h1><a href="index.html?admin">← กลับ</a></div>
<div class="c"><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px"><input id="q" placeholder="🔍 ค้นหา" oninput="draw()" style="flex:1"><select id="fb" onchange="draw()"></select><select id="fk" onchange="draw()"></select><select id="fc" onchange="draw()"></select><select id="fg" onchange="draw()"></select><select id="fa" onchange="draw()"></select></div>
<div id="t"></div><div style="display:flex;justify-content:space-between;margin-top:12px;font-size:12px;color:#6b7280;align-items:center"><span>บันทึกในเบราว์เซอร์นี้ · ใช้กับตัวกรองในหน้าลูกค้า</span><span><button class="b" style="background:#eee" onclick="exp()">📋 คัดลอกไปใส่ customers.js</button> <button class="b" style="background:#D31145;color:#fff" onclick="sv()">✓ บันทึก</button></span></div></div></div>
<script>const KEY='ipf_page_meta';</script><script src="data/customers.js"></script><script>
if(!window._fi){window._fi=1;document.addEventListener('DOMContentLoaded',()=>{});}
function draw(){
const E=Object.entries(CUSTOMERS),KD={main:'สัญญาหลัก',rider:'สัญญาเพิ่มเติม'},GD={m:'ชาย',f:'หญิง'};
const F=[['fb','ทุกยี่ห้อ',p=>p.brand,v=>BRANDS[v]||v],['fk','ทุกประเภท',p=>p.kind||'main',v=>KD[v]],['fc','ทุกชนิด',p=>p.cat,v=>CATS[v]||v],['fg','ทุกเพศ',p=>p.g,v=>GD[v]],['fa','ทุกอายุ',p=>p.age==null?'':String(p.age),v=>v+' ปี']];
let R=E;F.forEach(([id,all,get,lab])=>{const el=document.getElementById(id),cur=el.value,vals=[...new Set(R.map(([,p])=>get(p)).filter(v=>v!==''&&v!=null))].sort((x,y)=>id==='fa'?x-y:0);
 el.innerHTML=`<option value="">${all}</option>`+vals.map(v=>`<option value="${v}">${lab(v)}</option>`).join('');el.value=vals.map(String).includes(cur)?cur:'';
 if(el.value)R=R.filter(([,p])=>String(get(p))===el.value)});
const q=document.getElementById('q').value.toLowerCase();R=R.filter(([id,p])=>!q||(p.lbl+id).toLowerCase().includes(q));
t.innerHTML=`<table><tr><th>หน้าแผน</th><th>ยี่ห้อ</th><th>ประเภท</th><th>ชนิด</th><th>เพศ</th><th>อายุ</th><th>แผนในหน้า</th><th></th></tr>${R.map(([id,p])=>`<tr data-id="${id}"><td><b>${p.icon} ${p.lbl}</b><br><small style="color:#6b7280">${p.url}</small></td><td><select class="br">${Object.entries(BRANDS).map(([k,v])=>`<option value="${k}" ${p.brand===k?'selected':''}>${v}</option>`).join('')}</select></td><td><select class="k"><option value="main" ${(p.kind||'main')==='main'?'selected':''}>📄 สัญญาหลัก</option><option value="rider" ${p.kind==='rider'?'selected':''}>➕ สัญญาเพิ่มเติม</option></select></td><td><select class="ct">${Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${p.cat===k?'selected':''}>${v}</option>`).join('')}</select></td>
<td><select class="g"><option value="">-</option><option value="m" ${p.g==='m'?'selected':''}>ชาย</option><option value="f" ${p.g==='f'?'selected':''}>หญิง</option></select></td>
<td><input class="a" type="number" value="${p.age??''}" style="width:70px"></td><td style="font-size:12px">${(p.plans||[]).map(x=>x[0]).join('<br>')||'-'}</td><td><a href="${p.url}" target="_blank">↗</a></td></tr>`).join('')}</table>`}
function sv(){const o=JSON.parse(localStorage.getItem(KEY)||'{}');document.querySelectorAll('tr[data-id]').forEach(r=>{const id=r.dataset.id,v={brand:r.querySelector('.br').value,cat:r.querySelector('.ct').value,kind:r.querySelector('.k').value,g:r.querySelector('.g').value||null,age:r.querySelector('.a').value===''?null:+r.querySelector('.a').value};o[id]=v;Object.assign(CUSTOMERS[id],v)});localStorage.setItem(KEY,JSON.stringify(o));alert('บันทึกแล้ว')}
function exp(){sv();const o=JSON.parse(localStorage.getItem(KEY)||'{}');navigator.clipboard.writeText(JSON.stringify(o,null,1));alert('คัดลอกแล้ว ส่งให้ผู้ช่วยอัปเดต customers.js ได้')}
draw()</script><script src="js/admin-nav.js"></script>
</body></html>
