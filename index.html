<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>สรุปแผนประกันสุขภาพ AIA</title>
<style>
:root{--aia:#D31145;--aia-bg:#fdecf1;--t:#1a1a1a;--t2:#5e5e5e;--m:#9ca3af;--b:rgba(0,0,0,.1);--card:#fff;--bg:#faf9fc}
*{box-sizing:border-box}
body{margin:0;padding:24px;font-family:'Sarabun','Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--t)}
.wrap{max-width:980px;margin:auto}
.hd{background:var(--aia);color:#fff;border-radius:14px;padding:20px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.hd h1{margin:0;font-size:22px}.hd p{margin:4px 0 0;opacity:.9;font-size:14px}
.sw{display:flex;background:rgba(255,255,255,.18);border-radius:22px;padding:4px;gap:4px}
.sw button{border:0;background:transparent;color:#fff;padding:7px 14px;border-radius:18px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.sw button.on{background:#fff;color:var(--aia);font-weight:700}
.base{margin:16px 0;background:var(--card);border:1px solid var(--b);border-radius:12px;padding:14px 18px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.base b{color:var(--aia);font-size:18px}
.warn{margin:0 0 20px;background:#fff7e6;border:1px solid #f59e0b;border-left:5px solid #f59e0b;border-radius:12px;padding:12px 16px;font-size:14px;color:#92400e}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.c{background:var(--card);border:1px solid var(--b);border-radius:14px;padding:20px;position:relative;display:flex;flex-direction:column}
.c.hl{border:2px solid var(--aia);box-shadow:0 6px 18px rgba(211,17,69,.15)}
.tag{position:absolute;top:-12px;left:20px;background:var(--aia);color:#fff;font-size:12px;padding:3px 12px;border-radius:12px}
.tag.g{background:#16a34a}.tag.b{background:#2563eb}
.c h2{margin:6px 0 2px;font-size:19px}.sub{color:var(--t2);font-size:13px;margin-bottom:14px}
.lump{background:var(--aia-bg);color:var(--aia);border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--b);font-size:14px}
.row span:first-child{color:var(--t2)}.row span:last-child{font-weight:600;text-align:right}
.no{color:var(--m)!important;font-weight:400!important}
.tot{margin-top:auto;padding-top:14px;text-align:center}
.tot .y{font-size:28px;font-weight:700;color:var(--aia)}.tot .mo{font-size:13px;color:var(--t2)}
table{width:100%;border-collapse:collapse;margin-top:20px;background:var(--card);border-radius:12px;overflow:hidden;font-size:14px}
th{background:var(--aia-bg);color:var(--aia);padding:10px;text-align:center}
td{padding:10px;border-bottom:1px solid var(--b);text-align:center}td:first-child{text-align:left;color:var(--t2)}
.note{margin-top:16px;font-size:12px;color:var(--m);line-height:1.6}
@media print{body{background:#fff;padding:0}.sw button:not(.on){display:none}.c,.base,table{break-inside:avoid}}
</style></head><body><div class="wrap">

<div class="hd"><div><h1>🩺 สรุปแผนประกันสุขภาพ AIA</h1><p>เปรียบเทียบ 3 แผน เพื่อพิจารณาเลือก</p></div>
<div class="sw"><button data-k="f43" class="on">👩 หญิง · 43 ปี</button><button data-k="m25" style="display:none">👨 ชาย · 25 ปี</button></div></div>

<div class="base"><span>📋 สัญญาหลัก (ทุนประกันขั้นต่ำ 100,000 บาท)</span><span>เบี้ย <b>2,539</b> บาท/ปี · รวมอยู่ในทุกแผน</span></div>

<div class="warn">⏰ <b>Health Saver และ Health Happy เปิดขายถึง 30 พ.ย. 2569 เท่านั้น</b> — หลังจากนั้นจะปิดการขาย และจะมีแผนใหม่มาแทน ซึ่งอาจมี<b>ค่าใช้จ่ายร่วม (Co-payment) เป็น %</b></div>

<div class="grid" id="grid"></div>
<table id="tbl"></table>

<div class="note" id="note"></div>
</div>
<script>
const BASE=2539;
const D={
 f43:{lbl:'เพศหญิง อายุ 43 ปี',saver:26500,h15:42900,h25:53600,starter:19500},
 m25:{lbl:'เพศชาย อายุ 25 ปี',saver:13400,h15:21600,h25:28000}
};
const f=n=>n.toLocaleString('en-US');
const LUMP='<div class="lump">✨ <b>แบบเหมาจ่าย</b> — ทุนสูง ไม่ต้องกังวลวงเงินแยกรายการ</div>';
function tot(r){const t=r+BASE;return `<div class="tot"><div class="y">${f(t)}</div><div class="mo">บาท/ปี · เฉลี่ย ~${f(Math.round(t/12))}/เดือน</div></div>`}
function row(a,b,no){return `<div class="row"><span>${a}</span><span${no?' class="no"':''}>${b}</span></div>`}
function render(k){
 const d=D[k];
 const st=d.starter!=null;
 const mn=Math.min(d.saver,st?d.starter:Infinity);
 document.getElementById('grid').innerHTML=(st?`
 <div class="c"><span class="tag g">💰 ประหยัดสุด</span><h2>Health Starter (Balance)</h2><div class="sub">เบี้ยต่ำสุด มี OPD · เน้นใช้ รพ. ในเครือข่าย</div>
 <div class="lump" style="background:#fff7e6;color:#92400e">⚠️ <b>มีค่าใช้จ่ายร่วม</b> — รพ. ใน AIA Smart Network ไม่มีค่าใช้จ่ายร่วม · รพ. นอก Network จ่ายร่วม 20%</div>
 ${row('ค่าห้อง/วัน','4,500')}${row('OPD','7,000/ปี')}${row('เบี้ยสัญญาเพิ่มเติม',f(d.starter))}${row('เบี้ยสัญญาหลัก',f(BASE))}${tot(d.starter)}</div>`:'')+`
 <div class="c"><span class="tag g">${st?'⚖️ คุ้มค่า':'💰 ประหยัดสุด'}</span><h2>Health Saver 4000</h2><div class="sub">ครบทั้ง IPD + OPD ในงบสบายกระเป๋า</div>
 ${row('ค่าห้อง/วัน','4,000')}${row('OPD','1,500 × 30 ครั้ง/ปี')}${row('เบี้ยสัญญาเพิ่มเติม',f(d.saver))}${row('เบี้ยสัญญาหลัก',f(BASE))}${tot(d.saver)}</div>
 <div class="c"><span class="tag b">🏥 เน้นผู้ป่วยใน</span><h2>Health Happy 15 ล้าน</h2><div class="sub">วงเงินสูง ห้องดี ไม่มี OPD</div>${LUMP}
 ${row('วงเงินคุ้มครอง','15 ล้าน')}${row('ค่าห้อง/วัน','6,000')}${row('OPD','ไม่คุ้มครอง',1)}${row('เบี้ยสัญญาเพิ่มเติม',f(d.h15))}${row('เบี้ยสัญญาหลัก',f(BASE))}${tot(d.h15)}</div>
 <div class="c hl"><span class="tag">⭐ คุ้มครองครบที่สุด</span><h2>Health Happy 25 ล้าน</h2><div class="sub">วงเงินสูงสุด ห้องดีที่สุด + OPD</div>${LUMP}
 ${row('วงเงินคุ้มครอง','25 ล้าน')}${row('ค่าห้อง/วัน','9,000')}${row('OPD','2,000 × 30 ครั้ง/ปี')}${row('เบี้ยสัญญาเพิ่มเติม',f(d.h25))}${row('เบี้ยสัญญาหลัก',f(BASE))}${tot(d.h25)}</div>`;
 const dif=v=>v===mn?'–':'+'+f(v-mn);
 document.getElementById('tbl').innerHTML=`<tr><th>รายการ</th>${st?'<th>Health Starter</th>':''}<th>Health Saver 4000</th><th>Health Happy 15 ล้าน</th><th>Health Happy 25 ล้าน</th></tr>
 <tr><td>ค่าห้อง/วัน</td>${st?'<td>4,500</td>':''}<td>4,000</td><td>6,000</td><td>9,000</td></tr>
 <tr><td>OPD สูงสุด/ปี</td>${st?'<td>7,000</td>':''}<td>45,000</td><td>–</td><td>60,000</td></tr>
 ${st?'<tr><td>ค่าใช้จ่ายร่วม</td><td>นอก Network 20%</td><td>–</td><td>–</td><td>–</td></tr>':''}
 <tr><td>เบี้ยรวม/ปี</td>${st?`<td><b>${f(d.starter+BASE)}</b></td>`:''}<td><b>${f(d.saver+BASE)}</b></td><td><b>${f(d.h15+BASE)}</b></td><td><b>${f(d.h25+BASE)}</b></td></tr>
 <tr><td>ส่วนต่างจากแผนประหยัดสุด</td>${st?`<td>${dif(d.starter)}</td>`:''}<td>${dif(d.saver)}</td><td>${dif(d.h15)}</td><td>${dif(d.h25)}</td></tr>`;
 document.getElementById('note').innerHTML=`* เบี้ยประกันสำหรับ${d.lbl} เป็นตัวเลขประมาณการ อาจเปลี่ยนแปลงตามการพิจารณารับประกันของบริษัท<br>* OPD สูงสุด/ปี = วงเงินต่อครั้ง × จำนวนครั้ง · เบี้ยรายเดือนเป็นค่าเฉลี่ย (เบี้ยรายปี ÷ 12)<br>* โปรดศึกษารายละเอียดความคุ้มครองและเงื่อนไขในกรมธรรม์ก่อนตัดสินใจ`;
 document.querySelectorAll('.sw button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
}
document.querySelectorAll('.sw button').forEach(b=>b.onclick=()=>render(b.dataset.k));
render(D[new URLSearchParams(location.search).get('p')]?new URLSearchParams(location.search).get('p'):'f43');
</script></body></html>
